<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Measure corners — dev tool</title>
<!--
  DEV TOOL (not linked from the site)
  ---------------------------------------------------------------
  Use it after replacing assets/images/hero-scene.jpg or
  assets/images/pov-scene.jpg:

    1. Serve the project (Live Server) and open /tools/measure-corners.html
    2. Pick the photo (or load any image from your computer).
    3. Click the painting's corners in this order:
         top-left → top-right → bottom-right → bottom-left
       (for the bench outline, click as many points as you like, in order)
    4. Copy the array and paste it into js/hero-scene.js
       (ENTRANCE.artwork, ENTRANCE.bench or POV.artwork).

  Coordinates are in the photo's NATIVE pixels, whatever size it is
  shown at here — exactly what hero-scene.js expects.
-->
<style>
  :root { --ink: #1D1D1D; --soft: #666; --line: #E3E0DA; --violet: #5C4BDB; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.5 Inter, system-ui, sans-serif; color: var(--ink); background: #F7F5F2; padding: 24px; }
  h1 { font: 400 26px Georgia, serif; }
  p.lead { color: var(--soft); margin: 6px 0 18px; max-width: 760px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  button, select, label.file {
    font: inherit; padding: 7px 13px; border-radius: 20px; border: 1px solid var(--line);
    background: #fff; cursor: pointer;
  }
  button:hover, label.file:hover { border-color: var(--ink); }
  label.file input { display: none; }
  .stage { position: relative; display: inline-block; max-width: 100%; cursor: crosshair; }
  .stage img { display: block; max-width: 100%; height: auto; user-select: none; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .info { margin: 10px 0; color: var(--soft); }
  textarea { width: 100%; max-width: 760px; height: 170px; font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
</style>
</head>
<body>
  <h1>Measure corners</h1>
  <p class="lead">Click the painting’s corners in order — top-left, top-right, bottom-right, bottom-left — then copy the result into <code>js/hero-scene.js</code>. Coordinates are reported in the photo’s native pixels.</p>

  <div class="bar">
    <select id="preset">
      <option value="../assets/images/pov-scene.jpg">pov-scene.jpg (seated)</option>
      <option value="../assets/images/hero-scene.jpg">hero-scene.jpg (entrance)</option>
    </select>
    <label class="file">Load another image…<input type="file" id="file" accept="image/*"></label>
    <button type="button" id="undo">Undo last point</button>
    <button type="button" id="clear">Clear</button>
    <button type="button" id="copy">Copy array</button>
  </div>

  <div class="stage" id="stage">
    <img id="photo" alt="Photo to measure">
    <svg id="marks" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <p class="info" id="info">Native size: —</p>
  <textarea id="out" readonly spellcheck="false"></textarea>

<script>
  const photo = document.getElementById('photo');
  const marks = document.getElementById('marks');
  const out = document.getElementById('out');
  const info = document.getElementById('info');
  let points = [];

  function load(src) {
    points = [];
    photo.src = src;
  }

  function render() {
    const w = photo.naturalWidth;
    const h = photo.naturalHeight;
    marks.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const r = Math.max(w, h) / 220;
    const poly = points.length > 1
      ? `<polygon points="${points.map((p) => `${p.x},${p.y}`).join(' ')}" fill="rgba(92,75,219,.15)" stroke="#5C4BDB" stroke-width="${r / 2}"/>`
      : '';
    const dots = points.map((p, i) => `
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="#5C4BDB" stroke="#fff" stroke-width="${r / 3}"/>
      <text x="${p.x + r * 1.6}" y="${p.y - r * 1.2}" font-size="${r * 3}" fill="#fff" stroke="#1D1D1D" stroke-width="${r / 4}" paint-order="stroke">${i + 1}</text>`).join('');
    marks.innerHTML = poly + dots;

    info.textContent = `Native size: ${w} × ${h} px · ${points.length} point(s)`;
    out.value = points.length
      ? `[\n${points.map((p) => `  { x: ${p.x}, y: ${p.y} },`).join('\n')}\n]`
      : '';
  }

  photo.addEventListener('load', render);

  document.getElementById('stage').addEventListener('click', (event) => {
    const rect = photo.getBoundingClientRect();
    const x = Math.round(((event.clientX - rect.left) / rect.width) * photo.naturalWidth);
    const y = Math.round(((event.clientY - rect.top) / rect.height) * photo.naturalHeight);
    points.push({ x, y });
    render();
  });

  document.getElementById('preset').addEventListener('change', (e) => load(e.target.value));
  document.getElementById('file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) load(URL.createObjectURL(file));
  });
  document.getElementById('undo').addEventListener('click', () => { points.pop(); render(); });
  document.getElementById('clear').addEventListener('click', () => { points = []; render(); });
  document.getElementById('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(out.value); } catch { out.select(); document.execCommand('copy'); }
  });

  load(document.getElementById('preset').value);
</script>
</body>
</html>
